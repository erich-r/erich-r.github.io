---
layout: base
title: Blog
permalink: /blog/
---
<section>
    <h1 class="page-title">Blog</h1>
    {% if site.posts.size > 0 %}
    <ul class="post-list">
        {% for post in site.posts %}<li>{% include post-card.html post=post %}</li>{% endfor %}
    </ul>
    {% else %}
    <p class="empty-note">No posts yet.</p>
    {% endif %}
</section>
