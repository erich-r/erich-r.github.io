<a href="{{ include.post.url | relative_url }}" class="card">
    <div class="card-head">
        <h3 class="card-title">{{ include.post.title }}</h3>
        <time class="date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
    </div>
    <p class="card-text">{{ include.post.description | default: include.post.excerpt | strip_html | strip_newlines | truncate: 200 }}</p>
</a>
