<!DOCTYPE html>
<html lang="en">

    {% include head.html %}

    <body>
    <div class="content-wrapper list-page" id="top">
        <a class="project-back" href="{{ '/' | relative_url }}#{{ page.back_anchor | default: 'top' }}">&larr; Back to {{ page.back_label | default: "Home" }}</a>

        <header class="list-header">
            <h1 class="list-title">{{ page.title }}</h1>
            {% if page.subtitle %}<p class="list-subtitle">{{ page.subtitle }}</p>{% endif %}
        </header>

        {{ content }}
    </div>

    {% include footer.html %}
</body>
</html>
